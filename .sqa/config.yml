      github.com/ARGOeu/argo-ams-library flake8:
        commands:
        - /usr/bin/env sh .sqa/script.scarlet_enigmatic_octopus.sh
        container: qc.sty_violet_anxious_fox
      github.com/ARGOeu/argo-ams-library hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.flax_tenacious_spren.sh
        container: qc.sty_reef_brilliant_manatee
