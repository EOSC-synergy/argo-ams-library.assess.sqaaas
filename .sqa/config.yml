config:
  credentials: []
  project_repos:
    github.com/ARGOeu/argo-ams-library:
      branch: master
      repo: https://github.com/ARGOeu/argo-ams-library
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: fix/updatego
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/ARGOeu/argo-ams-library git:
        commands:
        - /usr/bin/env sh .sqa/script.sapphire_cranky_rabbit.sh
        container: qc.acc_fog_courageous_viper
  QC.Doc:
    repos:
      github.com/ARGOeu/argo-ams-library find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.cyan_worried_caribou.sh
        container: qc.doc_pistachio_plucky_opossum
      github.com/ARGOeu/argo-ams-library git:
        commands:
        - /usr/bin/env sh .sqa/script.olive_resilient_anaconda.sh
        container: qc.doc_cornflower_lively_rattlesnake
      github.com/ARGOeu/argo-ams-library markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.cardamom_organized_goose.sh
        container: qc.doc_tan_funny_rabbit
      github.com/ARGOeu/argo-ams-library restructuredtext-lint:
        commands:
        - /usr/bin/env sh .sqa/script.steel_humorous_crocodile.sh
        container: qc.doc_cherry_kind_whale
  QC.Lic:
    repos:
      github.com/ARGOeu/argo-ams-library licensee:
        commands:
        - /usr/bin/env sh .sqa/script.tan_diligent_dingo.sh
        container: qc.lic_rust_funny_okapi
  QC.Sec:
    repos:
      github.com/ARGOeu/argo-ams-library bandit:
        commands:
        - /usr/bin/env sh .sqa/script.gray_resilient_wolf.sh
        container: qc.sec_mahogany_clever_cormorant
  QC.Sty:
    repos:
      github.com/ARGOeu/argo-ams-library flake8:
        commands:
        - /usr/bin/env sh .sqa/script.harlequin_respectful_spren.sh
        container: qc.sty_thunder_savvy_nymph
      github.com/ARGOeu/argo-ams-library hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.teal_logical_badger.sh
        container: qc.sty_kiwi_romantic_cheetah
  QC.Uni:
    repos:
      github.com/ARGOeu/argo-ams-library pytest:
        commands:
        - /usr/bin/env sh .sqa/script.paprika_brilliant_heron.sh
        container: qc.uni_dusk_wise_cormorant
