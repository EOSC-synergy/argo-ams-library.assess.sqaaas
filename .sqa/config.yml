    repos:
      github.com/ARGOeu/argo-ams-library get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.coral_innocent_dingo.sh
        container: qc.ver_aquamarine_resilient_thrush
timeout: 5400
