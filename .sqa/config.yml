config:
  credentials: []
  project_repos:
    github.com/ARGOeu/argo-ams-library:
      branch: master
      repo: https://github.com/ARGOeu/argo-ams-library
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: feature/pynblint_fix
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/ARGOeu/argo-ams-library git:
        commands:
        - /usr/bin/env sh .sqa/script.whiny-charcoal-woodpecker.sh
        container: qc.acc_cranky-mauve-gopher
  QC.Doc:
    repos:
      github.com/ARGOeu/argo-ams-library find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.lousy-tan-discus.sh
        container: qc.doc_slimy-heliotrope-spider
      github.com/ARGOeu/argo-ams-library git:
        commands:
        - /usr/bin/env sh .sqa/script.tacky-tomato-salamander.sh
        container: qc.doc_hasty-heliotrope-kingfisher
      github.com/ARGOeu/argo-ams-library markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.thirsty-buff-budgerigar.sh
        container: qc.doc_surly-alizarin-stoat
      github.com/ARGOeu/argo-ams-library restructuredtext-lint:
        commands:
        - /usr/bin/env sh .sqa/script.stinky-persimmon-robin.sh
        container: qc.doc_chewy-brass-squirrel
  QC.Lic:
    repos:
      github.com/ARGOeu/argo-ams-library licensee:
        commands:
        - /usr/bin/env sh .sqa/script.muzzy-turquoise-moth.sh
        container: qc.lic_chewy-periwinkle-meerkat
  QC.Sec:
    repos:
      github.com/ARGOeu/argo-ams-library bandit:
        commands:
        - /usr/bin/env sh .sqa/script.shaggy-goldenrod-mongoose.sh
        container: qc.sec_paltry-copper-loon
  QC.Sty:
    repos:
      github.com/ARGOeu/argo-ams-library flake8:
        commands:
        - /usr/bin/env sh .sqa/script.lousy-emerald-collie.sh
        container: qc.sty_sickly-smalt-tang
      github.com/ARGOeu/argo-ams-library hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.sickly-celadon-earwig.sh
        container: qc.sty_stuffy-ruby-malamute
  QC.Uni:
    repos:
      github.com/ARGOeu/argo-ams-library pytest:
        commands:
        - /usr/bin/env sh .sqa/script.wheezy-coral-quetzal.sh
        container: qc.uni_craggy-peach-woodlouse
  QC.Ver:
    repos:
      github.com/ARGOeu/argo-ams-library get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.seedy-pink-spaniel.sh
        container: qc.ver_craggy-buff-sparrow
timeout: 5400
